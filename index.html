<html lang="zh-Hant">

</head>
<body>


<meta charset="UTF-8" />
<title>連抽陀螺券</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f3efe4;
    --paper-raised: #fbf9f3;
    --ink: #1c1a17;
    --ink-soft: #6b6459;
    --line: #d9d0bc;
    --ember: #ff4d1c;
    --ember-ink: #ffffff;
    --steel: #2f6690;
    --gold: #b9791c;
    --shadow: 220 30% 10%;
    --focus: #1c1a17;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18191b;
      --paper-raised: #212327;
      --ink: #ece7da;
      --ink-soft: #96907f;
      --line: #35363a;
      --ember: #ff6a3c;
      --ember-ink: #1a1000;
      --steel: #6fb2dd;
      --gold: #e0a94f;
      --focus: #ece7da;
    }
  }

  :root[data-theme="dark"] {
    --paper: #18191b;
    --paper-raised: #212327;
    --ink: #ece7da;
    --ink-soft: #96907f;
    --line: #35363a;
    --ember: #ff6a3c;
    --ember-ink: #1a1000;
    --steel: #6fb2dd;
    --gold: #e0a94f;
    --focus: #ece7da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .display {
    font-family: "Chakra Petch", "Noto Sans TC", sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 80px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .eyebrow {
    font-family: "Chakra Petch", sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ember);
    font-weight: 600;
  }

  h1 {
    font-family: "Chakra Petch", sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-soft);
    font-size: 0.92rem;
    max-width: 60ch;
  }

  /* ---------- Progress bar ---------- */
  .progress-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .progress-row strong {
    font-family: "Chakra Petch", sans-serif;
    color: var(--ink);
    font-size: 0.95rem;
  }

  .progress-track {
    height: 8px;
    border-radius: 5px;
    background: var(--line);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--ember));
    border-radius: 5px;
    transition: width 0.35s ease;
  }

  /* ---------- Filter chips ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    font-family: "Chakra Petch", sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }

  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .chip.only-ux21[aria-pressed="true"] {
    background: var(--ember);
    border-color: var(--ember);
    color: var(--ember-ink);
  }

  .chip:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Ticket ---------- */
  .ticket {
    display: grid;
    grid-template-columns: 1fr auto;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px -18px hsl(var(--shadow) / 0.6);
    position: relative;
    overflow: hidden;
  }

  .ticket::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: calc(100% - 152px);
    width: 0;
    border-left: 2px dashed var(--line);
  }

  .ticket-main {
    padding: 22px 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .ticket-region {
    font-family: "Chakra Petch", sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--steel);
    font-weight: 600;
  }

  .ticket-store {
    font-family: "Chakra Petch", sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    text-wrap: balance;
  }

  .ticket-product {
    font-size: 1rem;
    font-weight: 500;
  }

  .ticket-price {
    font-family: "Chakra Petch", sans-serif;
    color: var(--gold);
    font-weight: 600;
  }

  .ticket-empty {
    font-size: 1.05rem;
    color: var(--ink-soft);
    padding: 10px 0 4px;
  }

  .ticket-stub {
    width: 152px;
    flex-shrink: 0;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }

  .stub-count {
    font-family: "Chakra Petch", sans-serif;
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
  }

  .stub-count b {
    display: block;
    font-size: 1.5rem;
    color: var(--ink);
    line-height: 1.1;
  }

  .btn-primary, .btn-secondary {
    font-family: "Chakra Petch", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    border-radius: 9px;
    padding: 11px 12px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    min-height: 44px;
    min-width: 44px;
  }

  .btn-primary {
    background: var(--ember);
    color: var(--ember-ink);
  }

  .btn-primary:active { transform: translateY(1px); }

  .btn-secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    font-weight: 500;
    font-size: 0.78rem;
  }

  .actions-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .actions-row .btn-secondary { width: auto; flex: 1; }

  /* ---------- Directory ---------- */
  .directory h2 {
    font-family: "Chakra Petch", sans-serif;
    font-size: 1.05rem;
    margin: 0 0 10px;
  }

  .directory-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .search-input {
    flex: 1 1 200px;
    font-family: "Noto Sans TC", sans-serif;
    font-size: 0.88rem;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
  }

  .search-input::placeholder { color: var(--ink-soft); }

  .search-input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .hide-drawn-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    cursor: pointer;
  }

  details.city {
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--paper-raised);
  }

  details.city > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "Chakra Petch", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
  }

  details.city > summary::-webkit-details-marker { display: none; }

  .city-meta {
    font-size: 0.76rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .city-body { padding: 0 14px 12px; }

  details.store {
    border-top: 1px solid var(--line);
    padding: 8px 0;
  }

  details.store:first-child { border-top: none; }

  details.store > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 4px 2px;
  }

  details.store > summary::-webkit-details-marker { display: none; }

  .store-meta { color: var(--ink-soft); font-size: 0.78rem; }

  ul.items {
    list-style: none;
    margin: 6px 0 2px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  ul.items li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
  }

  ul.items li:hover { background: var(--line); }

  ul.items li .row-check {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    accent-color: var(--ember);
    cursor: pointer;
  }

  ul.items li .row-label {
    flex: 1;
    min-width: 0;
    font-size: 0.86rem;
    color: var(--ink);
    overflow-wrap: break-word;
  }

  ul.items li.drawn .row-label { color: var(--ink-soft); text-decoration: line-through; }

  ul.items li .row-price { color: var(--gold); flex-shrink: 0; font-family: "Chakra Petch", sans-serif; font-size: 0.86rem; }
  ul.items li.drawn .row-price { color: var(--ink-soft); }

  ul.items li .row-draw-btn {
    flex-shrink: 0;
    font-family: "Chakra Petch", sans-serif;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--ember);
    color: var(--ember-ink);
    text-decoration: none;
  }

  ul.items li.drawn .row-draw-btn { background: var(--line); color: var(--ink-soft); }

  footer {
    color: var(--ink-soft);
    font-size: 0.76rem;
    text-align: center;
    padding-top: 6px;
  }

  footer a { color: var(--steel); }

  @media (max-width: 480px) {
    .ticket { grid-template-columns: 1fr; }
    .ticket::before { display: none; }
    .ticket-stub {
      width: auto;
      border-top: 2px dashed var(--line);
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .stub-count { text-align: left; }
    .stub-count b { font-size: 1.2rem; }
    .ticket-stub .btn-primary {
      width: auto;
      flex: 0 0 auto;
      padding: 11px 16px;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">FUNBOX × BEYBLADE X 抽選券</div>

  <div class="actions-row">

  <div class="directory">

        隱藏已抽過
      </label>
    </div>
    <div id="directoryRoot"></div>
  </div>

  <footer>
    11/06 11/07 檔期・資料整理自各店官方 LINE 抽選連結。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var STORES = JSON.parse(document.getElementById("draw-data").textContent);
  var DRAWN_KEY = "funbox_draw_drawn_v1";
  var POS_KEY = "funbox_draw_pos_v1";

  function getCode(product) {
    var m = product.match(/^([A-Za-z]+-\d+)/);
    if (m) return m[1].toUpperCase();
    var m2 = product.match(/^(\S+)/);
    return m2 ? m2[1] : product;
  }

  // Flatten into a single ordered queue of draws.
  var ALL = [];
  STORES.forEach(function (store) {
    store.products.forEach(function (p) {
      var m = p.product.match(/^(.*?)（\$([\d,]+)）\s*$/);
      var name = m ? m[1] : p.product;
      var price = m ? m[2] : "";
      ALL.push({
        city: store.city,
        store: store.name,
        product: name,
        code: getCode(name),
        price: price,
        url: p.url
      });
    });
  });

  var cities = [];
  ALL.forEach(function (d) { if (cities.indexOf(d.city) === -1) cities.push(d.city); });

  var itemCodes = [];
  ALL.forEach(function (d) { if (itemCodes.indexOf(d.code) === -1) itemCodes.push(d.code); });
  itemCodes.sort();

  function readJson(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || "null") || fallback; }
    catch (e) { return fallback; }
  }
  function writeJson(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var drawn = readJson(DRAWN_KEY, {});
  // Empty set == no filter on that dimension (show everything).
  var state = { cities: new Set(), items: new Set(), pos: 0 };
  var directoryQuery = "";
  var hideDrawn = false;
  var savedPos = readJson(POS_KEY, null);
  if (savedPos && typeof savedPos.pos === "number") state.pos = savedPos.pos;

  function matchesFilter(d) {
    if (state.cities.size && !state.cities.has(d.city)) return false;
    if (state.items.size && !state.items.has(d.code)) return false;
    return true;
  }

  function currentQueue() {
    return ALL.filter(matchesFilter);
  }

  function clampPos(queue) {
    if (queue.length === 0) return 0;
    if (state.pos >= queue.length) state.pos = queue.length - 1;
    if (state.pos < 0) state.pos = 0;
    return state.pos;
  }

  function persistPos() {
    writeJson(POS_KEY, { pos: state.pos });
  }

  // ---------- Header chips (multi-select: a set of chips per dimension,
  // plus a leading "全部" chip that clears that dimension's set) ----------
  function buildMultiSelectGroup(container, allLabel, options, selectionSet, countFn) {
    container.innerHTML = "";

    var allBtn = document.createElement("button");
    allBtn.className = "chip";
    allBtn.type = "button";
    allBtn.textContent = allLabel + " (" + countFn(null) + ")";
    allBtn.addEventListener("click", function () {
      selectionSet.clear();
      state.pos = 0;
      render();
    });
    container.appendChild(allBtn);

    options.forEach(function (opt) {
      var btn = document.createElement("button");
      btn.className = "chip only-ux21";
      btn.type = "button";
      btn.textContent = opt + " (" + countFn(opt) + ")";
      btn.addEventListener("click", function () {
        if (selectionSet.has(opt)) selectionSet.delete(opt);
        else selectionSet.add(opt);
        state.pos = 0;
        render();
      });
      container.appendChild(btn);
    });
  }

  var cityFilters = document.getElementById("cityFilters");
  function cityCount(city) {
    return ALL.filter(function (d) { return city === null ? true : d.city === city; }).length;
  }
  function buildChips() {
    buildMultiSelectGroup(cityFilters, "全部縣市", cities, state.cities, cityCount);
  }

  var itemFilters = document.getElementById("itemFilters");
  function itemCount(code) {
    return ALL.filter(function (d) { return code === null ? true : d.code === code; }).length;
  }
  function buildItemChips() {
    buildMultiSelectGroup(itemFilters, "全部品項", itemCodes, state.items, itemCount);
  }

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("確定要清除所有已開的標記與進度嗎？")) return;
    drawn = {};
    writeJson(DRAWN_KEY, drawn);
    state.pos = 0;
    render();
    buildDirectory();
  });

  document.getElementById("skipBtn").addEventListener("click", function () {
    var q = currentQueue();
    if (state.pos < q.length - 1) state.pos++;
    persistPos();
    render();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    if (state.pos > 0) state.pos--;
    persistPos();
    render();
  });

  function openAndAutoClose(url) {
    var win = window.open(url, "_blank");
    if (win) {
      setTimeout(function () {
        try { win.close(); } catch (e) {}
      }, 1200);
    }
  }

  var openBtn = document.getElementById("openBtn");
  openBtn.addEventListener("click", function (e) {
    e.preventDefault();
    var q = currentQueue();
    var idx = clampPos(q);
    var d = q[idx];
    if (!d) return;
    openAndAutoClose(d.url);
    markDrawn(d.url, true);
    if (idx < q.length - 1) state.pos = idx + 1;
    persistPos();
    setTimeout(function () { render(); buildDirectory(); }, 30);
  });

  function renderTicket() {
    var q = currentQueue();
    var idx = clampPos(q);
    var d = q[idx];
    var region = document.getElementById("curRegion");
    var storeEl = document.getElementById("curStore");
    var productEl = document.getElementById("curProduct");
    var idxEl = document.getElementById("curIndex");

    if (!d) {
      region.textContent = "—";
      storeEl.textContent = "這個篩選條件下沒有項目";
      productEl.textContent = "";
      idxEl.textContent = "–";
      openBtn.removeAttribute("href");
      openBtn.setAttribute("aria-disabled", "true");
      return;
    }

    region.textContent = d.city + " · " + d.store;
    storeEl.textContent = d.product;
    productEl.innerHTML = d.price ? ("售價 <span class=\"ticket-price\">$" + d.price + "</span>" + (drawn[d.url] ? " · 已標記開過" : "")) : (drawn[d.url] ? "已標記開過" : "");
    idxEl.textContent = (idx + 1) + " / " + q.length;
    openBtn.href = d.url;
    openBtn.removeAttribute("aria-disabled");
  }

  function renderProgress() {
    var totalDrawnGlobal = Object.keys(drawn).filter(function (u) {
      return ALL.some(function (d) { return d.url === u; });
    }).length;
    document.getElementById("drawnCount").textContent = totalDrawnGlobal;
    document.getElementById("totalCount").textContent = ALL.length;
    var pct = ALL.length ? Math.round((totalDrawnGlobal / ALL.length) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    var cityLabel = state.cities.size ? Array.from(state.cities).join("、") : "全部縣市";
    var itemLabel = state.items.size ? " · " + Array.from(state.items).join("、") : "";
    document.getElementById("filterLabel").textContent = cityLabel + itemLabel;
  }

  function renderChipsState() {
    Array.prototype.forEach.call(cityFilters.children, function (chip, i) {
      chip.setAttribute("aria-pressed", i === 0 ? (state.cities.size === 0 ? "true" : "false") : (state.cities.has(cities[i - 1]) ? "true" : "false"));
    });
    Array.prototype.forEach.call(itemFilters.children, function (chip, i) {
      chip.setAttribute("aria-pressed", i === 0 ? (state.items.size === 0 ? "true" : "false") : (state.items.has(itemCodes[i - 1]) ? "true" : "false"));
    });
  }

  var directoryRoot = document.getElementById("directoryRoot");

  function markDrawn(url, checked) {
    if (checked) drawn[url] = true; else delete drawn[url];
    writeJson(DRAWN_KEY, drawn);
  }

  function advanceQueueTo(url) {
    var q = currentQueue();
    var qIdx = q.findIndex(function (d) { return d.url === url; });
    if (qIdx !== -1 && qIdx < q.length - 1) state.pos = qIdx + 1;
    persistPos();
  }

  function buildDirectory() {
    directoryRoot.innerHTML = "";
    var q = directoryQuery.trim().toLowerCase();

    cities.forEach(function (city) {
      var storesInCity = STORES.filter(function (s) { return s.city === city; });
      var cityBlocks = [];
      var cityTotalItems = 0;

      storesInCity.forEach(function (store) {
        var storeNameMatches = !q || store.name.toLowerCase().indexOf(q) !== -1;
        var visibleProducts = store.products.filter(function (p) {
          if (hideDrawn && drawn[p.url]) return false;
          if (!q) return true;
          return storeNameMatches || p.product.toLowerCase().indexOf(q) !== -1;
        });
        if (!visibleProducts.length) return;
        cityBlocks.push({ store: store, products: visibleProducts });
        cityTotalItems += visibleProducts.length;
      });

      if (!cityBlocks.length) return;

      var cityDetails = document.createElement("details");
      cityDetails.className = "city";
      cityDetails.open = !!q;
      var summary = document.createElement("summary");
      summary.innerHTML = "<span>" + city + "</span><span class=\"city-meta\">" + cityBlocks.length + " 店・" + cityTotalItems + " 抽</span>";
      cityDetails.appendChild(summary);

      var body = document.createElement("div");
      body.className = "city-body";

      cityBlocks.forEach(function (block) {
        var store = block.store;
        var storeDetails = document.createElement("details");
        storeDetails.className = "store";
        storeDetails.open = !!q;
        var sSummary = document.createElement("summary");
        sSummary.innerHTML = "<span>" + store.name + "</span><span class=\"store-meta\">" + block.products.length + " 抽</span>";
        storeDetails.appendChild(sSummary);

        var ul = document.createElement("ul");
        ul.className = "items";
        block.products.forEach(function (p) {
          var m = p.product.match(/^(.*?)（\$([\d,]+)）\s*$/);
          var name = m ? m[1] : p.product;
          var price = m ? m[2] : "";
          var isDrawn = !!drawn[p.url];
          var li = document.createElement("li");
          if (isDrawn) li.className = "drawn";

          var check = document.createElement("input");
          check.type = "checkbox";
          check.className = "row-check";
          check.checked = isDrawn;
          check.title = "標記為已抽過";
          check.addEventListener("change", function () {
            markDrawn(p.url, check.checked);
            setTimeout(function () { render(); buildDirectory(); }, 30);
          });

          var label = document.createElement("span");
          label.className = "row-label";
          label.textContent = name;

          var btn = document.createElement("a");
          btn.className = "row-draw-btn";
          btn.href = p.url;
          btn.textContent = "單抽";
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            openAndAutoClose(p.url);
            markDrawn(p.url, true);
            advanceQueueTo(p.url);
            setTimeout(function () { render(); buildDirectory(); }, 30);
          });

          li.appendChild(check);
          li.appendChild(label);
          if (price) {
            var priceEl = document.createElement("span");
            priceEl.className = "row-price";
            priceEl.textContent = "$" + price;
            li.appendChild(priceEl);
          }
          li.appendChild(btn);
          ul.appendChild(li);
        });
        storeDetails.appendChild(ul);
        body.appendChild(storeDetails);
      });

      cityDetails.appendChild(body);
      directoryRoot.appendChild(cityDetails);
    });

    if (!directoryRoot.children.length) {
      var empty = document.createElement("p");
      empty.className = "ticket-empty";
      empty.textContent = hideDrawn ? "都已經抽過了（或搜尋不到符合的項目）" : "搜尋不到符合的門市或商品";
      directoryRoot.appendChild(empty);
    }
  }

  document.getElementById("searchBox").addEventListener("input", function (e) {
    directoryQuery = e.target.value;
    buildDirectory();
  });

  document.getElementById("hideDrawnToggle").addEventListener("change", function (e) {
    hideDrawn = e.target.checked;
    buildDirectory();
  });

  function render() {
    renderChipsState();
    renderTicket();
    renderProgress();
  }

  buildChips();
  buildItemChips();
  buildDirectory();
  render();
})();
</script>



</body>
</html>
